name: Check portfolio pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check dist/content.js
          node --check dist/app.js
          node --check dist/story.js
          node tests/validate-content.mjs
      - name: Check root page assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get('src') or (attrs.get('href') if tag == 'link' else None)
                  if value and '://' not in value:
                      assert Path(value.split('?')[0]).is_file(), f'Missing asset: {value}'
          Assets().feed(Path('index.html').read_text())
          PY

